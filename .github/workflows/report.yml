name: Open Pipeline Health

on:
  schedule:
    - cron: "45 7 * * *"      # 09:45 Cairo (UTC+2) — after Claude's 08:31 note review
  workflow_dispatch: {}        # "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build dashboard + write All_Notes tab
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
          SF_DOMAIN: ${{ secrets.SF_DOMAIN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TZ: Africa/Cairo
        run: python pipeline_health.py
      - uses: actions/upload-artifact@v4
        with:
          name: open-pipeline-health
          path: |
            Open_Pipeline_Health_*.html
            Notes_To_Review_*.csv
          if-no-files-found: warn
