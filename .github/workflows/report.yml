name: Pipeline health report

on:
  schedule:
    - cron: "0 6 * * *"      # every day 06:00 UTC (≈ 8–9 am Cairo)
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build report from Salesforce
        run: python run_report.py
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_TOKEN: ${{ secrets.SF_TOKEN }}

      - name: Save notes that still need reviewing
        if: hashFiles('Notes_To_Review_*.csv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: notes-to-review
          path: Notes_To_Review_*.csv
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
